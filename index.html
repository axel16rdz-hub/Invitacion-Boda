<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    /* =========================
       CARTA (VIDEO)
    ========================= */
    #carta {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #videoCarta {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      #videoCarta {
        height: 90vh;
      }
    }

    /* =========================
       INVITACIÓN
    ========================= */
    #invitacion {
      display: none;
      width: 100%;
    }

    .imagen-contenedor {
      position: relative;
      width: 100%;
      max-width: 100vw;
    }

    .imagen-contenedor img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       BOTONES UBICACIÓN (INVISIBLES)
    ========================= */
    .btn-ubicacion {
      position: absolute;  
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-ubicacion-1 {
      top: 48%;
      left: 18.8%;
      width: 60%;
      height: 4%;
    }

    .btn-ubicacion-2 {
      top: 68%;
      left: 18.8%;
      width: 60%;
      height: 4%;
    }

    /* =========================
       CONTADOR
    ========================= */
    #contador {
      position: absolute;
      top: 17.4%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 44px;
      pointer-events: none;
    }

    #contador span {
      font-size: clamp(50px, 10vw, 113px);
      font-weight: bold;
      color: #000;
      line-height: 1;
      text-align: center;
      width: 25%;
    }
  </style>
</head>

<body>

  <!-- CARTA -->
  <div id="carta">
    <video id="videoCarta" autoplay muted loop playsinline>
      <source src="carta.mp4" type="video/mp4">
    </video>
  </div>

  <!-- INVITACIÓN -->
  <div id="invitacion">
    <div class="imagen-contenedor">

      <img src="invitacion.png" alt="Invitación">

      <!-- CONTADOR -->
      <div id="contador">
        <span id="dias">00</span>
        <span id="horas">00</span>
        <span id="minutos">00</span>
      </div>

      <!-- BOTÓN UBICACIÓN 1 -->
      <a href="https://maps.app.goo.gl/Hkm7U6M79eE3ZUNa6"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-1"></a>

      <!-- BOTÓN UBICACIÓN 2 -->
      <a href="https://maps.app.goo.gl/KDXyNGjm1b6S59qH7"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-2"></a>

    </div>
  </div>

  <!-- =========================
       AUDIO
  ========================= -->
  <audio id="musica" loop>
    <source src="música.mp3" type="audio/mpeg">
  </audio>

  <script>
    const carta = document.getElementById('carta');
    const invitacion = document.getElementById('invitacion');
    const video = document.getElementById('videoCarta');

    // =========================
    // REPRODUCIR INVITACIÓN Y MÚSICA CON FADE IN
    carta.addEventListener('click', () => {
      carta.style.display = 'none';
      invitacion.style.display = 'block';
      video.pause();

      const musica = document.getElementById('musica');
      musica.currentTime = 100; // inicia en 1:40
      musica.volume = 0;         // empieza silenciosa
      musica.play().catch(err => console.log("No se pudo reproducir:", err));

      // fade in rápido (aprox 2 segundos)
      let volumen = 0;
      const fadeInterval = setInterval(() => {
        volumen += 0.02;
        if(volumen >= 1){
          volumen = 1;
          clearInterval(fadeInterval);
        }
        musica.volume = volumen;
      }, 40); // cada 40ms sube un poquito
    });

    // =========================
    // CONTADOR
    const diasEl = document.getElementById("dias");
    const horasEl = document.getElementById("horas");
    const minutosEl = document.getElementById("minutos");

    const fechaEvento = new Date("2026-03-21T18:00:00-06:00");

    function actualizarContador() {
      const ahora = new Date();
      let diff = fechaEvento - ahora;

      if (diff <= 0) diff = 0;

      const totalMin = Math.floor(diff / 60000);
      const totalHoras = Math.floor(totalMin / 60);

      const dias = Math.floor(totalHoras / 24);
      const horas = totalHoras % 24;
      const minutos = totalMin % 60;

      diasEl.textContent = dias.toString().padStart(2, "0");
      horasEl.textContent = horas.toString().padStart(2, "0");
      minutosEl.textContent = minutos.toString().padStart(2, "0");
    }

    actualizarContador();
    setInterval(actualizarContador, 1000);
  </script>

</body>
</html>
