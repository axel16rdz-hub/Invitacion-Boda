<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>

  <style>
    /* =========================
       RESET
    ========================= */
    body {
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    /* =========================
       CARTA (VIDEO)
    ========================= */
    #carta {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #videoCarta {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      #videoCarta {
        height: 90vh;
      }
    }

    /* =========================
       INVITACIÓN
    ========================= */
    #invitacion {
      display: none;
      width: 100%;
    }

    .imagen-contenedor {
      position: relative;
      width: 100%;
      max-width: 100vw;
    }

    .imagen-contenedor img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       BOTONES (VISIBLES PARA AJUSTE)
    ========================= */
    .btn-ubicacion {
      position: absolute;
      background: rgba(255, 0, 0, 0.4); /* ROJO VISIBLE */
      border: 22px dashed red;
      cursor: pointer;
    }

    /* UBICACIÓN 1 */
    .btn-ubicacion-1 {
      top: 46%;
      left: 20%;
      width: 60%;
      height: 4%;
    }

    /* UBICACIÓN 2 */
    .btn-ubicacion-2 {
      top: 68%;
      left: 20%;
      width: 60%;
      height: 4%;
    }
  </style>
</head>

<body>

  <!-- CARTA -->
  <div id="carta">
    <video id="videoCarta" autoplay muted loop playsinline>
      <source src="carta.mp4" type="video/mp4">
    </video>
  </div>

  <!-- INVITACIÓN -->
  <div id="invitacion">
    <div class="imagen-contenedor">

      <img src="invitacion.png" alt="Invitación">

      <!-- BOTÓN UBICACIÓN 1 -->
      <a href="https://www.google.com/maps"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-1"
         aria-label="Ver ubicación 1"></a>

      <!-- BOTÓN UBICACIÓN 2 -->
      <a href="https://www.google.com/maps"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-2"
         aria-label="Ver ubicación 2"></a>

    </div>
  </div>

  <script>
    const carta = document.getElementById('carta');
    const invitacion = document.getElementById('invitacion');
    const video = document.getElementById('videoCarta');

    // Al tocar la carta → abre invitación
    carta.addEventListener('click', () => {
      carta.style.display = 'none';
      invitacion.style.display = 'block';
      video.pause();
    });
  </script>

</body>
</html>
