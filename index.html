<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CARTA (VIDEO) -->
  <div id="carta" onclick="abrirInvitacion()">
    <video id="videoCarta" autoplay muted loop playsinline>
      <source src="carta.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
  </div>

  <!-- INVITACIÓN -->
  <div id="invitacion" style="display:none">
    <div class="imagen-contenedor">

      <img src="invitacion.png" alt="Invitación">

      <!-- BOTÓN INVISIBLE: VER UBICACIÓN -->
      <a href="https://www.google.com/maps"
         class="btn-ubicacion"
         target="_blank"
         aria-label="Ver ubicación"></a>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
