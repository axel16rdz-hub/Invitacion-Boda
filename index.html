<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>

  <style>
    /* =========================
       RESET
    ========================= */
    body {
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    /* =========================
       CARTA (VIDEO)
    ========================= */
    #carta {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #videoCarta {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      #videoCarta {
        height: 90vh;
      }
    }

    /* =========================
       INVITACIÓN
    ========================= */
    #invitacion {
      display: none;
      width: 100%;
    }

    .imagen-contenedor {
      position: relative;
      width: 100%;
      max-width: 100vw;
    }

    .imagen-contenedor img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       BOTONES (VISIBLES PARA AJUSTE)
    ========================= */
    .btn-ubicacion {
      position: absolute;
      background: rgba(255, 0, 0, 0.4);
      border: 2px dashed red;
      cursor: pointer;
    }

    .btn-ubicacion-1 {
      top: 48%;
      left: 18.8%;
      width: 60%;
      height: 4%;
    }

    .btn-ubicacion-2 {
      top: 68%;
      left: 18.8%;
      width: 60%;
      height: 4%;
    }

    /* =========================
       CONTADOR
    ========================= */
    #contador {
      position: absolute;
      top: 35%; /* AJUSTA SEGÚN TU DISEÑO */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .numero {
      min-width: 60px;
      padding: 10px 14px;
      background: #fff;
      border-radius: 8px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- CARTA -->
  <div id="carta">
    <video id="videoCarta" autoplay muted loop playsinline>
      <source src="carta.mp4" type="video/mp4">
    </video>
  </div>

  <!-- INVITACIÓN -->
  <div id="invitacion">
    <div class="imagen-contenedor">

      <img src="invitacion.png" alt="Invitación">

      <!-- CONTADOR -->
      <div id="contador">
        <div class="numero"><span id="dias">00</span></div>
        <div class="numero"><span id="horas">00</span></div>
        <div class="numero"><span id="minutos">00</span></div>
      </div>

      <!-- BOTÓN UBICACIÓN 1 -->
      <a href="https://maps.app.goo.gl/L3Au6aKSALD3kp5i7"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-1"
         aria-label="Ver ubicación 1"></a>

      <!-- BOTÓN UBICACIÓN 2 -->
      <a href="https://maps.app.goo.gl/KDXyNGjm1b6S59qH7"
         target="_blank"
         class="btn-ubicacion btn-ubicacion-2"
         aria-label="Ver ubicación 2"></a>

    </div>
  </div>

  <script>
    const carta = document.getElementById('carta');
    const invitacion = document.getElementById('invitacion');
    const video = document.getElementById('videoCarta');

    carta.addEventListener('click', () => {
      carta.style.display = 'none';
      invitacion.style.display = 'block';
      video.pause();
    });

    /* =========================
       CONTADOR LOGICA
    ========================= */
    const diasEl = document.getElementById("dias");
    const horasEl = document.getElementById("horas");
    const minutosEl = document.getElementById("minutos");

    const fechaEvento = new Date("2026-03-21T18:00:00-06:00");

    function actualizarContador() {
      const ahora = new Date();
      let diff = fechaEvento - ahora;

      if (diff <= 0) {
        diasEl.textContent = "00";
        horasEl.textContent = "00";
        minutosEl.textContent = "00";
        return;
      }

      const totalMin = Math.floor(diff / 1000 / 60);
      const totalHoras = Math.floor(totalMin / 60);

      const dias = Math.floor(totalHoras / 24);
      const horas = totalHoras % 24;
      const minutos = totalMin % 60;

      diasEl.textContent = dias.toString().padStart(2, "0");
      horasEl.textContent = horas.toString().padStart(2, "0");
      minutosEl.textContent = minutos.toString().padStart(2, "0");
    }

    actualizarContador();
    setInterval(actualizarContador, 1000);
  </script>

</body>
</html>
