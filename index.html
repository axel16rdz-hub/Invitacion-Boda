<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CARTA -->
  <div id="carta">
    <div class="carta-contenido">
      <h1>Tenemos algo especial para ti</h1>
      <button onclick="abrirInvitacion()">Abrir invitación</button>
    </div>
  </div>

  <!-- INVITACIÓN -->
  <div id="invitacion" style="display:none">
    <div class="imagen-contenedor">

      <img src="invitacion.png" alt="Invitación">

      <!-- BOTÓN INVISIBLE: VER UBICACIÓN -->
      <a href="https://www.google.com/maps"
         class="btn-ubicacion"
         target="_blank"
         aria-label="Ver ubicación"></a>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
