<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación de Boda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #f2f2f2;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .spotify {
      margin: 30px 0;
      text-align: center;
    }

    .contador {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <!-- ================== SVG DE LA INVITACIÓN ================== -->
  <!-- PEGA AQUÍ TODO TU SVG (desde <svg> hasta </svg>) -->
  <!-- EJEMPLO: -->

  <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">

    <!-- FONDO DE EJEMPLO (BORRA ESTO CUANDO PEGUES TU SVG) -->
    <rect width="800" height="1200" fill="#ffffff"/>

    <text x="400" y="300" text-anchor="middle" font-size="48">
      Invitación de boda
    </text>

    <!-- LINK A UBICACIÓN -->
    <a href="https://maps.app.goo.gl/FannHuA9Qo6j9bhe8"
       target="_blank">
      <text x="400" y="700"
            text-anchor="middle"
            font-size="28"
            fill="#0066cc"
            style="cursor:pointer;text-decoration:underline">
        📍 Ver ubicación
      </text>
    </a>

  </svg>
  <!-- =========================================================== -->

  <!-- ================== SPOTIFY ================== -->
  <div class="spotify">
    <p>🎵 Nuestra canción</p>

    <iframe style="border-radius:12px"
      src="https://open.spotify.com/intl-es/track/4MjDJD8cW7iVeWInc2Bdyj?si=ef979c0ef8e94621
      width="100%"
      height="80"
      frameBorder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <!-- ================== CONTADOR ================== -->
  <div class="contador">
    Visitas: <span id="visitas">0</span>
  </div>

</div>

<script>
  fetch('https://api.countapi.xyz/hit/invitacion-boda-elva/visitas')
    .then(response => response.json())
    .then(data => {
      document.getElementById('visitas').innerText = data.value;
    });
</script>

</body>
</html>
